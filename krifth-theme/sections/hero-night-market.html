{% set images = shop.slider|split_list %}
<section class="glaze-hero" aria-labelledby="hero-title">
  <div>
    <h1 id="hero-title">The kiln stays open after dark.</h1>
    <p class="lead">Bolder glazes and evening prices for Friday night at the market. Same hands and same clay as Sunday Kiln.</p>
    <div class="actions"><a class="btn-fire" href="#shop">See tonight's stall</a><a class="btn-quiet" href="#story">Who we are</a></div>
  </div>
  <figure class="board" aria-label="The Night Market brand genome shown as six glaze test tiles">
    <div class="tile" style="--g:var(--glaze-1);--dip:50%"><span><b>Lantern amber</b>buttons and prices</span></div>
    <div class="tile" style="--g:var(--glaze-2);--dip:46%"><span><b>Hibiscus</b>offers</span></div>
    <div class="tile" style="--g:var(--glaze-3);--dip:54%"><span><b>Night indigo</b>the sky behind it all</span></div>
    <div class="tile" style="--g:var(--glaze-4);--dip:44%"><span><b>Palm green</b>in stock</span></div>
    <div class="tile" style="--g:var(--glaze-5);--dip:52%"><span><b>Pepper red</b>last few left</span></div>
    <div class="tile" style="--g:var(--clay);--dip:0%"><span><b>Raw clay</b>every surface</span></div>
    <figcaption>Night Market's genome: the same kiln, fired in six evening glazes.</figcaption>
  </figure>
</section>
