{% set images = shop.slider|split_list %}
<section class="glaze-hero" aria-labelledby="hero-title">
  <div>
    <h1 id="hero-title">Bright pots for busy tables.</h1>
    <p class="lead">Market-day colours and honest prices, straight from our studio to your table. Stalls open at eight every Saturday.</p>
    <div class="actions"><a class="btn-fire" href="#shop">See what's on the stall</a><a class="btn-quiet" href="#story">Meet the stall</a></div>
  </div>
  <figure class="board" aria-label="The Saturday Market brand genome shown as six glaze test tiles">
    <div class="tile" style="--g:var(--glaze-1);--dip:48%"><span><b>Market green</b>buttons and links</span></div>
    <div class="tile" style="--g:var(--glaze-2);--dip:44%"><span><b>Umbrella yellow</b>banners</span></div>
    <div class="tile" style="--g:var(--glaze-3);--dip:52%"><span><b>Tomato</b>offers</span></div>
    <div class="tile" style="--g:var(--glaze-4);--dip:50%"><span><b>Sky</b>new this week</span></div>
    <div class="tile" style="--g:var(--glaze-5);--dip:46%"><span><b>Hibiscus</b>gifts</span></div>
    <div class="tile" style="--g:var(--clay);--dip:0%"><span><b>Sun clay</b>every surface</span></div>
    <figcaption>Saturday Market's genome: six glazes borrowed from the umbrellas at Makola.</figcaption>
  </figure>
</section>
