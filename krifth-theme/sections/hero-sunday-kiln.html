{% set images = shop.slider|split_list %}
<section class="glaze-hero" aria-labelledby="hero-title">
  <div>
    <h1 id="hero-title">Fired on Sundays. Used every day.</h1>
    <p class="lead">Small-batch stoneware from our kiln in Accra, thrown and glazed by hand. Pay with MoMo and we deliver across the city.</p>
    <div class="actions"><a class="btn-fire" href="#shop">Shop the collection</a><a class="btn-quiet" href="#story">Read our story</a></div>
  </div>
  <figure class="board" aria-label="The Sunday Kiln brand genome shown as six glaze test tiles">
    <div class="tile" style="--g:var(--glaze-1);--dip:48%"><span><b>Cobalt</b>buttons and links</span></div>
    <div class="tile" style="--g:var(--glaze-2);--dip:44%"><span><b>Celadon</b>quiet backgrounds</span></div>
    <div class="tile" style="--g:var(--glaze-3);--dip:54%"><span><b>Tenmoku</b>words and type</span></div>
    <div class="tile" style="--g:var(--glaze-4);--dip:50%"><span><b>Wood ash</b>edges and lines</span></div>
    <div class="tile" style="--g:var(--glaze-5);--dip:55%"><span><b>Iron red</b>offers and sale marks</span></div>
    <div class="tile" style="--g:var(--clay);--dip:0%"><span><b>Buff clay</b>every surface</span></div>
    <figcaption>Our brand genome, fired as test tiles. Every page in this shop uses these six glazes.</figcaption>
  </figure>
</section>
